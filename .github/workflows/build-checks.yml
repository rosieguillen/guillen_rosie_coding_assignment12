name: Assignment 13 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-checks:
    name: Build checks
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify production container
        run: |
          docker build -t guillen_rosie_coding_assignment13 .
          docker run -d --name guillen_rosie_coding_assignment13 -p 127.0.0.1:8018:8018 guillen_rosie_coding_assignment13
          test "$(docker inspect --format '{{.Config.WorkingDir}}' guillen_rosie_coding_assignment13)" = /guillen_rosie_ui_garden_build_checks
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8018/
